[project]
name = "fastapi-microservice-template"
version = "0.1.0"
description = "The Ultimate Super-Convenient Template for Microservices Based on FastAPI"
authors = [{ name = "binarycat", email = "artur.rakhmatulin@gmail.com" }]
requires-python = ">=3.11.0, <4"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.6,<0.116",
    "alembic>=1.14.0,<2",
    "pytest>=8.3.4,<9",
    "pytest-mock>=3.14.0,<4",
    "pytest-cover>=3.0.0,<4",
    "black>=24.10.0,<25",
    "mypy>=1.14.1,<2",
    "isort>=5.13.2,<6",
    "pydantic-settings>=2.7.1,<3",
    "pydantic>=2.10.5,<3",
    "psycopg2-binary>=2.9.10,<3",
    "asyncpg>=0.30.0,<0.31",
    "gevent>=24.11.1,<25",
    "uvicorn>=0.34.0,<0.35",
    "jinja2>=3.1.5,<4",
    "pytest-asyncio>=0.26.0,<0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-v"
pythonpath = "src"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.mypy]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
exclude = ["tests", "src/db/alembic"]

[tool.black]
exclude = "src/db/alembic"

[tool.isort]
multi_line_output = 3
